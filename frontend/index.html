<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f9">
  <title>News article verification</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <h1>Check a news article</h1>
    <p class="sub">Paste an article or claim to run the project’s fake/real classifier and evidence verification.</p>

    <section class="card input-card" aria-label="Article input">
      <label for="article-text">Article text or claim</label>
      <textarea id="article-text" maxlength="20000" placeholder="Paste the article text or a specific claim here" aria-describedby="input-hint"></textarea>
      <div class="row">
        <button class="btn" id="analyze-button" type="button">Analyze article</button>
        <span class="hint" id="input-hint">Use at least 5 characters. Article text is limited to 20,000 characters.</span>
        <button class="link" id="sample-button" type="button">Try a sample claim</button>
      </div>
      <p class="error" id="error-message" role="alert" hidden></p>
      <div id="progress" aria-live="polite" hidden>
        <ul class="steps" id="steps"></ul>
      </div>
    </section>

    <section id="result" aria-live="polite" hidden></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
