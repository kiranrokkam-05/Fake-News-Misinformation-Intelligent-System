<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f9">
  <title>News article verification</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>
      <path d="M9 12l2 2 4-4"/>
    </svg>
    <span>Article check</span>
    <small>Evidence-based assessment</small>
  </header>
  <main>
    <h1>Check a news article</h1>
    <p class="sub">Paste an article or claim. We compare its claims against available sources and report what we find.</p>
    <section class="card" aria-label="Input">
      <div class="tabs" role="group" aria-label="Input type">
        <button type="button" id="tText" aria-pressed="true">Article text</button>
        <button type="button" id="tUrl" aria-pressed="false">Link</button>
      </div>
      <textarea id="txt" maxlength="20000" placeholder="Paste the full article text or a specific claim here" aria-label="Article text"></textarea>
      <input id="url" type="url" placeholder="https://example.com/news/article" aria-label="Article link" hidden>
      <div class="row">
        <button class="btn" id="go" type="button">Analyze article</button>
        <span class="hint">Try a sample:</span>
        <button class="link" data-sample="The Moon orbits the Earth." type="button">Moon orbit</button>
        <button class="link" data-sample="The Earth revolves around the Sun once approximately every 365.25 days." type="button">Earth orbit</button>
      </div>
      <p class="error" id="error-message" role="alert" hidden></p>
      <div id="progress" aria-live="polite" hidden><ul class="steps" id="steps"></ul></div>
    </section>
    <section id="result" aria-live="polite" hidden></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
